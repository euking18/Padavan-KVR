name: Padavan-K2P-KVR

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clone Source
      run: |
        git clone --depth=1 https://github.com/fightroad/Padavan-KVR.git /opt/rt-n56u

    - name: Hijack Toolchain (修复路径错误的终极逻辑)
      run: |
        cd /opt/rt-n56u/toolchain-mipsel
        
        # 1. 清理旧数据
        rm -rf toolchain-3.4.x *.tar.xz
        
        # 2. 下载工具链
        echo "Downloading toolchain..."
        wget -O toolchain.tar.xz https://github.com/hanwckf/padavan-toolchain/releases/download/v1.1/mipsel-linux-uclibc.tar.xz
        
        # 3. 解压
        echo "Extracting..."
        tar -xf toolchain.tar.xz
        
        # 4. === 关键修复：不猜名字，直接找 ===
        # 查看解压出了什么
        ls -F
        
        # 如果解压出来的不是 toolchain-3.4.x，手动改名
        if [ ! -d "toolchain-3.4.x" ]; then
            # 找到解压出的第一个文件夹 (通常是 mipsel-linux-uclibc)
            EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "mipsel*" | head -n 1)
            if [ -n "$EXTRACTED_DIR" ]; then
                echo "Renaming $EXTRACTED_DIR to toolchain-3.4.x"
                mv "$EXTRACTED_DIR" toolchain-3.4.x
            else
                echo "❌ Error: Toolchain extraction failed!"
                exit 1
            fi
        fi
        
        # 5. 再次确认并授权
        if [ -d "toolchain-3.4.x" ]; then
            echo "✅ Toolchain directory ready."
            chmod -R 755 toolchain-3.4.x
        else
            echo "❌ Critical Error: Directory still missing."
            exit 1
        fi

    - name: Modify Makefiles (屏蔽烂插件)
      run: |
        cd /opt/rt-n56u/trunk/user
        # 注释掉容易报错的插件编译项
        sed -i 's/^dir_y += shadowsocks/# dir_y += shadowsocks/g' Makefile
        sed -i 's/^dir_y += v2ray/# dir_y += v2ray/g' Makefile
        sed -i 's/^dir_y += trojan/# dir_y += trojan/g' Makefile
        sed -i 's/^dir_y += mentohust/# dir_y += mentohust/g' Makefile
        sed -i 's/^dir_y += njit/# dir_y += njit/g' Makefile
        
        # 去除 sudo
        cd ..
        sed -i 's/sudo //g' build_firmware_modify
        sed -i 's/sudo //g' tools/Makefile
        sed -i 's/sudo //g' Makefile

    - name: Prepare Config
      env:
        TNAME: K2P
      run: |
        cd /opt/rt-n56u/trunk
        cp -f configs/templates/$TNAME.config .config
        
        # 禁用所有插件配置
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER=y/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=y/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_V2RAY=y/CONFIG_FIRMWARE_INCLUDE_V2RAY=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_TROJAN=y/CONFIG_FIRMWARE_INCLUDE_TROJAN=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_MENTOHUST=y/CONFIG_FIRMWARE_INCLUDE_MENTOHUST=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT=y/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT=n/g' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TRANSMISSION/d' .config 
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ARIA/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ZEROTIER/d' .config
        
        sed -i 's/\r//' .config

    - name: Compile in Docker (Ubuntu 20.04)
      uses: addnab/docker-run-action@v3
      with:
        image: ubuntu:20.04
        options: -v /opt/rt-n56u:/opt/rt-n56u -w /opt/rt-n56u/trunk
        run: |
          # 容器环境配置
          sed -i 's/archive.ubuntu.com/mirrors.ustc.edu.cn/g' /etc/apt/sources.list
          apt-get update
          
          # 安装依赖
          apt-get -y install curl wget git tar unzip libtool-bin cmake gperf gawk flex bison nano xxd fakeroot \
          cpio python-docutils gettext automake autopoint texinfo build-essential help2man \
          pkg-config zlib1g-dev libgmp-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev \
          libssl-dev libelf-dev kmod vim-common bc python3-docutils
          
          # OpenSSL 修复
          mkdir -p /usr/include/openssl
          ln -sf /usr/include/x86_64-linux-gnu/openssl/opensslconf.h /usr/include/openssl/opensslconf.h || true
          
          # 时间戳修复
          find . -name "configure.ac" -exec touch {} +
          find . -name "Makefile.am" -exec touch {} +
          
          # 开始编译
          echo "Start building..."
          ./clear_tree
          ./build_firmware_modify K2P 0
          
          # 结果检查
          if ls images/*.trx 1> /dev/null 2>&1; then
             echo "✅ Build SUCCESS!"
             ls -lh images/*.trx
          else
             echo "❌ Build FAILED!"
             exit 1
          fi

    - name: Upload packages
      uses: actions/upload-artifact@master
      if: success()
      with:
        name: Padavan-K2P-KVR-Fixed
        path: /opt/rt-n56u/trunk/images
