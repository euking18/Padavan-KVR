name: Padavan-K2P-KVR-Real-80211r

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Init Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio python-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget
        
    - name: Clone Source (MeIsReallyBa - 继承了KVR补丁的活跃仓库)
      run: |
        git clone --depth=1 https://github.com/MeIsReallyBa/padavan-4.4.git /opt/rt-n56u

    - name: Setup Toolchain
      run: |
        cd /opt/rt-n56u/toolchain-mipsel
        # 这个仓库的工具链脚本是活的，可以直接用
        sh dl_toolchain.sh

    - name: Configure Pure Version
      env:
        TNAME: K2P
      run: |
        cd /opt/rt-n56u/trunk
        
        # 复制 K2P 模板
        if [ ! -f configs/templates/$TNAME.config ] ; then
            echo "Error: Config not found!"
            exit 1
        fi
        cp -f configs/templates/$TNAME.config .config
        
        # =======================================================
        # 1. 核心：开启 802.11r (KVR) 支持
        # =======================================================
        # 这个仓库默认通常开启，但我们强制确保一下无线驱动选项
        # 这一步是为了保留 fightroad 的驱动特性
        
        # =======================================================
        # 2. 强力净化：关闭所有多余插件 (n)
        # =======================================================
        
        # 科学上网类 (全关)
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=y/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_XRAY=y/CONFIG_FIRMWARE_INCLUDE_XRAY=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_V2RAY=y/CONFIG_FIRMWARE_INCLUDE_V2RAY=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_TROJAN=y/CONFIG_FIRMWARE_INCLUDE_TROJAN=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_SSOBFS=y/CONFIG_FIRMWARE_INCLUDE_SSOBFS=n/g' .config
        
        # 广告屏蔽类 (全关)
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_ADBYBY=y/CONFIG_FIRMWARE_INCLUDE_ADBYBY=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_KOOLPROXY=y/CONFIG_FIRMWARE_INCLUDE_KOOLPROXY=n/g' .config
        
        # 内网穿透类 (全关)
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_FRPC=y/CONFIG_FIRMWARE_INCLUDE_FRPC=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_FRPS=y/CONFIG_FIRMWARE_INCLUDE_FRPS=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_ZEROTIER=y/CONFIG_FIRMWARE_INCLUDE_ZEROTIER=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_ALIDDNS=y/CONFIG_FIRMWARE_INCLUDE_ALIDDNS=n/g' .config
        
        # 下载工具类 (全关)
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_TRANSMISSION=y/CONFIG_FIRMWARE_INCLUDE_TRANSMISSION=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_ARIA=y/CONFIG_FIRMWARE_INCLUDE_ARIA=n/g' .config
        
        # 校园网认证类 (全关)
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_MENTOHUST=y/CONFIG_FIRMWARE_INCLUDE_MENTOHUST=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT=y/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT=y/CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT=n/g' .config
        
        # 其他杂项
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER=y/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_WYY=y/CONFIG_FIRMWARE_INCLUDE_WYY=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_WYY_NODOG=y/CONFIG_FIRMWARE_INCLUDE_WYY_NODOG=n/g' .config
        
        # 修复换行符
        sed -i 's/\r//' .config

    - name: Build Firmware
      run: |
        cd /opt/rt-n56u/trunk
        # 清理
        sudo ./clear_tree
        
        # 开始编译
        sudo ./build_firmware_modify K2P 0
        
        # 移动固件
        sudo mv -f images/*.trx /opt/images/

    - name: Upload Firmware
      uses: actions/upload-artifact@master
      if: always()
      with:
        name: Padavan-K2P-KVR-Real
        path: /opt/images
