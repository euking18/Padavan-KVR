# KVR 终极版: Fightroad源码 + 22.04环境 + GCC9修复
name: Padavan-K2P-KVR-Build

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # 升级到 22.04，秒开，不用排队

    steps:
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        # 1. 安装编译 Padavan 所需的依赖 (注意 python3-docutils 是 22.04 专用)
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses-dev libltdl-dev wget \
        libssl-dev libelf-dev gcc-9 g++-9
        
        # 2. 核心修复：强制将系统编译器切换回 GCC-9 (否则 fightroad 的老代码会报错)
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 100

    - name: Clone source code (Fightroad KVR Version)
      run: |
        # 克隆 fightroad 的 KVR 专版源码
        git clone --depth=1 https://github.com/fightroad/Padavan-KVR.git /opt/rt-n56u

    - name: Hijack Toolchain (嫁接工具链)
      run: |
        cd /opt/rt-n56u/toolchain-mipsel
        # 3. 核心修复：手动下载 hanwckf 的工具链，救活 fightroad 的死链接
        echo "Downloading replacement toolchain..."
        wget -q https://github.com/hanwckf/padavan-toolchain/releases/download/v1.1/mipsel-linux-uclibc.tar.xz
        
        # 解压并清理
        tar -xvf mipsel-linux-uclibc.tar.xz
        rm -f mipsel-linux-uclibc.tar.xz

    - name: Build Firmware
      env:
        TNAME: K2P
        KERNEL: 3.4
      run: |
        cd /opt/rt-n56u/trunk
        
        # 读取配置文件
        if [ ! -f configs/templates/$TNAME.config ] ; then
            echo "configs/templates/$TNAME.config not found "
            exit 1
        fi
        cp -f configs/templates/$TNAME.config .config

        ################################################################
        #  KVR 纯净版配置
        ################################################################
        
        # 1. 关闭不常用的插件，保持纯净
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER=y/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_MENTOHUST=y/CONFIG_FIRMWARE_INCLUDE_MENTOHUST=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT=y/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT=n/g' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT=y/CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT=n/g' .config
        
        # 2. 删除大型应用
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TRANSMISSION/d' .config 
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ARIA/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ZEROTIER/d' .config
        
        # 3. 关闭科学上网 (Fightroad 原版代码这里的插件可能很旧，建议关闭以防报错)
        # 如果你确实需要 SS，可以尝试把 n 改为 y，但风险自负
        echo "CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_V2RAY=n" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_TROJAN=n" >> .config
        
        # 修复格式并编译
        sed -i 's/\r//' .config
        sudo ./clear_tree
        sudo ./build_firmware_modify $TNAME 0
        sudo mv -f images/*.trx /opt/images/

    - name: Upload packages
      uses: actions/upload-artifact@master
      if: always()
      with:
        name: Padavan-K2P-KVR
        path: /opt/images
